name: Todo App CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Using 'npm ci' is better for CI/CD as it's faster and cleaner
      - name: Install dependencies
        run: npm ci

      # This is the "Linux" fix that you run from inside the GitHub server
      - name: Run tests
        run: |
          chmod +x ./node_modules/.bin/jest
          npm test

      - name: Fake deploy
        if: success()
        run: |
          echo "Starting deployment..."
          sleep 2
          echo "Todo App deployed successfully 🚀"
